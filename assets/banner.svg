<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#06182f"/>
      <stop offset="0.55" stop-color="#16406f"/>
      <stop offset="1" stop-color="#21598f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="16" fill="url(#bg)"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="104" fill="#e6c766" font-size="18" font-weight="600" letter-spacing="3">IBU 060 · 2026/2027</text>
    <text x="64" y="162" fill="#ffffff" font-size="50" font-weight="600">Fundamentals of Programming</text>
    <text x="64" y="206" fill="#ccd6e4" font-size="20">International Burch University · Lecture and lab code</text>
  </g>

  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#ffffff" opacity="0.28">
    <text x="930" y="96">&gt;&gt;&gt; def greet(name):</text>
